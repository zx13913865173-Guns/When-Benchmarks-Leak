[model]
pretrained_model_name_or_path = "stabilityai/stable-diffusion-xl-base-1.0"

[dataset]
train_data_dir = "data/train/ink_wash"
resolution = 1024
batch_size = 2
enable_bucket = true
min_bucket_reso = 768
max_bucket_reso = 1280
bucket_reso_steps = 64
caption_extension = ".txt"

[network]
network_module = "networks.lora"
network_dim = 32
network_alpha = 1.0

[optimizer]
optimizer_type = "AdamW"
learning_rate = 1e-4
max_train_steps = 3000
lr_scheduler = "cosine"
lr_warmup_steps = 100

[output]
output_dir = "outputs/lora/ink_wash"
output_name = "ink_wash_lora"
save_every_n_epochs = 5

[logging]
logging_dir = "outputs/lora/ink_wash/logs"

[misc]
seed = 42
mixed_precision = "fp16"
save_precision = "fp16"
