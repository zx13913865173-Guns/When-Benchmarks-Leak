[model]
pretrained_model_name_or_path = "stabilityai/stable-diffusion-xl-base-1.0"

[dataset]
train_data_dir = "data/train/ukiyoe"
resolution = 1024
batch_size = 2
enable_bucket = true

[network]
network_module = "networks.lora"
network_dim = 32
network_alpha = 1.0

[optimizer]
optimizer_type = "AdamW"
learning_rate = 1e-4
max_train_steps = 3000

[output]
output_dir = "outputs/lora/ukiyoe"
output_name = "ukiyoe_lora"

[misc]
seed = 42
mixed_precision = "fp16"
